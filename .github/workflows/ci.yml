name: CI

on:
  push:
    branches:
      - main # deploys to prod (single Hetzner box, see deploy-prod below)

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun buddy lint

  typecheck:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: bun install

      # Gate on APP code only. The vendored framework under
      # storage/framework/core/ has long-standing type errors that are
      # upstream's to fix (they leak in via the tsconfig `paths` mapping
      # even though the directory is excluded), and gating on them meant
      # this job was permanently red and deploys never ran.
      # NOT `bunx --bun tsc`: running tsc on Bun's runtime segfaults here
      # ("panic: Segmentation fault", Bun 1.3.1). A crash prints no
      # "error TS" lines at all, so the grep below found nothing and this
      # job reported "typechecks clean" no matter what was broken — the
      # gate passed vacuously. Node-hosted tsc is stable, so use it, and
      # verify tsc actually ran before trusting a clean result.
      - name: Typecheck (app code)
        run: |
          # Proving tsc ran by requiring at least one "error TS" line worked
          # only while errors existed. The app now typechecks clean, so that
          # check inverted: a perfect run looked identical to a crash and the
          # job failed on success. Assert the compiler is present and runnable
          # instead — that is the thing the guard was really trying to
          # establish, and it stays true at zero errors.
          bunx tsc --version

          bunx tsc --noEmit 2>&1 | tee /tmp/tsc.log || true

          # Framework code lives in node_modules now, not storage/framework.
          # Dependencies' own declarations are skipLibCheck'd, so anything that
          # still surfaces from there is not this app's gate to fail.
          if grep "error TS" /tmp/tsc.log | grep -v "^node_modules/" | grep -q .; then
            echo "App-code type errors:"
            grep "error TS" /tmp/tsc.log | grep -v "^node_modules/"
            exit 1
          fi
          echo "App code typechecks clean ($(grep -c 'error TS' /tmp/tsc.log || true) dependency diagnostics ignored)"

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379

      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306

      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      # The vendored @stacksjs/testing used to build the schema from
      # setupTestEnvironment() — it shipped a database.ts that ran the auth,
      # notification and RBAC migrators. The published package exports only the
      # bun:test re-exports plus setupTestEnvironment/featureTest, so a fresh
      # checkout now starts with an empty database and every DB-backed test
      # fails with "no such table". Migrating explicitly is what the framework's
      # own docs describe as the separate step, and it is fast (~2s).
      #
      # Note this also rewrites database/migrations (the runner prunes files it
      # considers redundant — stacksjs/stacks#2234). That is harmless on an
      # ephemeral checkout and must not be run casually on a working tree.
      - name: Migrate database
        run: bun buddy migrate

      - name: Test Suite
        env:
          AWS_DYNAMODB_ENDPOINT: http://localhost:8000
        # `bun buddy test` (the package.json script) enters buddy's cli.ts
        # directly with the runner's bun — the same entry the lint and
        # typecheck jobs already use. `bun run test` resolved to the
        # ./buddy SHELL WRAPPER, which bootstraps pantry + system binaries
        # whenever the gitignored pantry/ dir is absent (always, in CI) and
        # has been dying against the 502ing registry.pantry.dev since
        # Jul 25. CI needs none of those binaries: setup-bun provides bun,
        # tests drive sqlite via bun:sqlite, mysql/redis are services.
        run: bun buddy test

  release-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      contains_release: ${{ steps.check_release.outputs.contains_release }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Release Check
        id: check_release
        run: |
          # Subject line ONLY (%s, not %B): the intent is to skip deploys for
          # bumpx-style "chore: release vX.Y.Z" commits. Matching the whole
          # body silently skipped deploys for any commit whose description
          # merely mentioned the word (e.g. "per-release systemd units") —
          # which is how 06e811a and 2d169c9 never shipped.
          if git log --format=%s -n 1 "${{ github.event.after }}" | grep -qi 'release'; then
            echo "contains_release=1" >> "$GITHUB_OUTPUT"
          else
            echo "contains_release=0" >> "$GITHUB_OUTPUT"
          fi

  # Push-to-deploy: every green push to main ships to the Hetzner box via
  # `buddy deploy production` (the same ts-cloud-backed path as a manual
  # deploy from a laptop). The `environment:` block makes GitHub record
  # this run under the repo's Deployments tab natively — which is exactly
  # why buddy's own GitHub-Deployments integration skips itself inside
  # Actions (see runHetznerDeploy/githubDeploymentsEnabled in buddy's
  # deploy command): recording it here too would duplicate.
  #
  # Required repo secrets (deploy is skipped with a notice until set):
  #   HCLOUD_TOKEN                    Hetzner Cloud API token
  #   DEPLOY_SSH_PRIVATE_KEY          ed25519 key whose pub key is on the box
  #                                   (deploy connects as root@<server-ip>)
  #   DOTENV_PRIVATE_KEY_PRODUCTION   decrypts the committed .env.production
  #                                   (from the local .env.keys file)
  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-check.outputs.contains_release == '0'
    needs: [lint, typecheck, test, release-check]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://statushq.org
    # One deploy at a time; a second push queues instead of racing the
    # first one onto the same box (deploys take ~25-30 minutes).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      # buddy's CLI bootstrap loads a root .env; production values come
      # from the committed (encrypted) .env.production at deploy time,
      # so example values here are fine and never reach the server.
      - name: Ensure .env Set
        run: cp .env.example .env

      - name: Check Deploy Secrets
        id: deploy-secrets
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
        run: |
          missing=""
          [ -z "$HCLOUD_TOKEN" ] && missing="$missing HCLOUD_TOKEN"
          [ -z "$DEPLOY_SSH_PRIVATE_KEY" ] && missing="$missing DEPLOY_SSH_PRIVATE_KEY"
          [ -z "$DOTENV_PRIVATE_KEY_PRODUCTION" ] && missing="$missing DOTENV_PRIVATE_KEY_PRODUCTION"
          # Fingerprint, not the value: a length and a SHA-256 prefix are safe
          # to print and are enough to tell whether the token the job receives
          # is the one you think you set. Added because a deploy kept returning
          # Hetzner 401 while that same token answered 200 to /servers,
          # /firewalls and /ssh_keys when tested directly — which means the
          # value arriving here is a different one. Whitespace is the usual
          # culprit, so the raw and trimmed lengths are both shown.
          raw_len=$(printf '%s' "$HCLOUD_TOKEN" | wc -c | tr -d ' ')
          trim_len=$(printf '%s' "$HCLOUD_TOKEN" | tr -d '[:space:]' | wc -c | tr -d ' ')
          fp=$(printf '%s' "$HCLOUD_TOKEN" | tr -d '[:space:]' | shasum -a 256 | cut -c1-16)
          echo "HCLOUD_TOKEN length=$raw_len trimmed=$trim_len sha256[0:16]=$fp"

          if [ -n "$missing" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping production deploy - missing repo secret(s):$missing"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # buddy deploy connects as root@<server-ip> with the default ssh
      # identity (no -i flag) and reads ~/.ssh/id_ed25519.pub during
      # provisioning, so both halves of the keypair go to the default
      # paths. StrictHostKeyChecking=accept-new is set by buddy itself.
      - name: Set up SSH Key
        if: steps.deploy-secrets.outputs.available == 'true'
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub

      # `bun buddy`, NOT the ./buddy wrapper. The wrapper execs with
      #   NODE_PATH="${PANTRY_DIR}:${NODE_PATH}"
      # so pantry wins module resolution — and every one of pantry's 106
      # @stacksjs entries is a symlink into storage/framework/core, the
      # vendored tree removed in 323df65. The deploy was therefore resolving
      # @stacksjs/env somewhere other than node_modules, which is why it could
      # not decrypt .env.production while the identical getEnv() call, run from
      # node_modules one step earlier in the same job, decrypted all 53 values.
      #
      # The comment this replaces said the bare CLI dies in a fresh runner
      # because it cannot find pantry on PATH. That was true while the
      # framework was vendored; lint, typecheck, test and migrate have all run
      # through `bun buddy` since the de-vendor without needing pantry at all.
      # Same env as the Deploy step below, run through bun so the bunfig
      # preload and env loading happen exactly as they do for the CLI. The
      # earlier fingerprint was taken in a plain shell step, which proves what
      # GitHub injected but not what the process actually ends up holding —
      # and a token that arrives correct and is then rewritten (to ciphertext,
      # to undefined) would look identical from outside. Fingerprint only.
      - name: Token as the deploy process sees it
        if: steps.deploy-secrets.outputs.available == 'true'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
        run: |
          bun -e '
            const t = process.env.HCLOUD_TOKEN ?? ""
            const c = require("crypto").createHash("sha256").update(t).digest("hex").slice(0,16)
            console.log("in-process HCLOUD_TOKEN: len=" + t.length + " cipher=" + t.startsWith("encrypted:") + " sha256=" + c)
            console.log("expected good token    : len=64 sha256=fc2aed12f07315ba")
          '

      # The env loader resolves the environment name to "development" and then
      # looks for DOTENV_PRIVATE_KEY_DEVELOPMENT, so DOTENV_PRIVATE_KEY_PRODUCTION
      # being set in the job is not enough — a production deploy still reports
      #   12 value(s) in .env.production could not be decrypted
      # and every encrypted value falls back to its default.
      #
      # Its key lookup reads .env.keys and, when it finds no key named for the
      # environment it thinks it is in, falls back to a bare DOTENV_PRIVATE_KEY.
      # Writing the production key under that name is what makes the lookup
      # succeed regardless of which environment it believes it is resolving.
      #
      # .env.keys is gitignored, the runner is ephemeral, and the value comes
      # from the same secret already passed below.
      - name: Provide the decryption key as .env.keys
        if: steps.deploy-secrets.outputs.available == 'true'
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
        run: |
          printf 'DOTENV_PRIVATE_KEY="%s"\nDOTENV_PRIVATE_KEY_PRODUCTION="%s"\n' \
            "$DOTENV_PRIVATE_KEY_PRODUCTION" "$DOTENV_PRIVATE_KEY_PRODUCTION" > .env.keys
          chmod 600 .env.keys

          # Fingerprint, not the value. The private key secret dates from the
          # same day as the Hetzner token that turned out to be the wrong
          # value, and a wrong key fails decryption in exactly the way a
          # missing one does. The working key from the project's own .env.keys
          # is sha256 9bc3de45963c9dcb — if this differs, the secret is stale
          # and no amount of writing it to disk will decrypt anything.
          klen=$(printf '%s' "$DOTENV_PRIVATE_KEY_PRODUCTION" | tr -d '[:space:]' | wc -c | tr -d ' ')
          kfp=$(printf '%s' "$DOTENV_PRIVATE_KEY_PRODUCTION" | tr -d '[:space:]' | shasum -a 256 | cut -c1-16)
          echo "wrote .env.keys — key len=$klen sha256=$kfp (expected sha256=9bc3de45963c9dcb)"

          # .env.keys alone is not enough. `buddy key:generate` runs during the
          # deploy and does:
          #
          #   hasPrivate = /^DOTENV_PRIVATE_KEY=.+$/m.test(<.env>)
          #   if (!hasPublic || !hasPrivate) { generateKeypair() -> setEnvValue(...) }
          #
          # .env is copied from .env.example, which carries no keypair, so it
          # mints a RANDOM one and writes it into .env. The loader then reads
          # that into process.env.DOTENV_PRIVATE_KEY, which outranks .env.keys —
          # so .env.production gets decrypted with a key that has existed for
          # about a second, and all 12 encrypted values fail.
          #
          # Seeding .env with the real pair makes both checks true, so no
          # keypair is generated and the correct key is the one in play. The
          # public half is not secret and already lives in .env.production.
          # Replace in place, do not append. .env.example ships the pair as
          # empty placeholders:
          #
          #   DOTENV_PUBLIC_KEY=
          #   DOTENV_PRIVATE_KEY=
          #
          # so appending leaves two lines for each name, and readers disagree
          # about which one counts — the loader took the populated one (getEnv
          # decrypts all 53 values in this job), while anything matching the
          # first occurrence, as setEnvValue does, got the empty one. That is
          # the split that let every input look correct while the deploy still
          # failed to decrypt.
          pub=$(grep '^DOTENV_PUBLIC_KEY_PRODUCTION=' .env.production | cut -d= -f2- | tr -d '"')
          if grep -q '^DOTENV_PUBLIC_KEY=' .env; then
            sed -i "s|^DOTENV_PUBLIC_KEY=.*|DOTENV_PUBLIC_KEY=\"$pub\"|" .env
          else
            printf '\nDOTENV_PUBLIC_KEY="%s"\n' "$pub" >> .env
          fi
          if grep -q '^DOTENV_PRIVATE_KEY=' .env; then
            sed -i "s|^DOTENV_PRIVATE_KEY=.*|DOTENV_PRIVATE_KEY=\"$DOTENV_PRIVATE_KEY_PRODUCTION\"|" .env
          else
            printf 'DOTENV_PRIVATE_KEY="%s"\n' "$DOTENV_PRIVATE_KEY_PRODUCTION" >> .env
          fi
          echo "seeded .env keypair in place — public occurrences=$(grep -c '^DOTENV_PUBLIC_KEY=' .env) private occurrences=$(grep -c '^DOTENV_PRIVATE_KEY=' .env)"

      # Runs the exact call the deploy fails on:
      #   resolveDeployEnvValues -> getEnv(undefined, { file: '.env.production', format: 'json' })
      # Locally that returns 52 keys with 0 still encrypted. In the runner the
      # deploy reports 12 undecryptable, with the correct key present in both
      # .env.keys and .env. Running it here shows which key the resolver
      # actually picks, and from where, instead of inferring it.
      - name: Can the runner decrypt .env.production?
        if: steps.deploy-secrets.outputs.available == 'true'
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
        run: |
          bun -e '
            const sha = (v) => v ? require("crypto").createHash("sha256").update(v).digest("hex").slice(0,16) : "-"
            for (const k of ["DOTENV_PRIVATE_KEY", "DOTENV_PRIVATE_KEY_PRODUCTION", "DOTENV_PRIVATE_KEY_DEVELOPMENT"]) {
              const v = process.env[k]
              console.log(`env ${k}: ${v ? "len=" + v.length + " sha=" + sha(v) : "unset"}`)
            }
            const fs = require("fs")
            for (const f of [".env", ".env.keys"]) {
              const line = fs.existsSync(f) ? (fs.readFileSync(f, "utf8").split("\n").find(l => /^DOTENV_PRIVATE_KEY=/.test(l)) ?? "") : "(file absent)"
              const val = line.replace(/^DOTENV_PRIVATE_KEY=/, "").replace(/^"|"$/g, "")
              console.log(`file ${f}: ${val ? "len=" + val.length + " sha=" + sha(val) : line || "no bare key"}`)
            }
            const { getEnv } = await import("@stacksjs/env")
            const r = getEnv(undefined, { file: ".env.production", format: "json" })
            if (!r.success || !r.output) { console.log("getEnv FAILED:", r.error); }
            else {
              const p = JSON.parse(r.output)
              const enc = Object.entries(p).filter(([, v]) => /^(encrypted|enc):/.test(String(v))).map(([k]) => k)
              console.log(`getEnv: ${Object.keys(p).length} keys, ${enc.length} still encrypted`)
            }
            console.log("known-good key sha=9bc3de45963c9dcb")
          '

      - name: Deploy
        if: steps.deploy-secrets.outputs.available == 'true'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          # Same key under the name the loader actually asks for. It resolves
          # the environment as "development" during a production deploy —
          #   no usable private key was found for the "development" environment;
          #   Set DOTENV_PRIVATE_KEY_DEVELOPMENT or ship .env.keys
          # — and looks up DOTENV_PRIVATE_KEY_<ENV> by that name, so
          # _PRODUCTION is never consulted no matter how correct it is.
          #
          # The values in .env.production are encrypted against a single
          # keypair, so naming it _DEVELOPMENT does not change which key is
          # used, only whether the lookup finds it.
          DOTENV_PRIVATE_KEY_DEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
        run: bun buddy deploy production --yes --verbose

  publish-commit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Publish Commit
        run: ./storage/framework/scripts/publish-commit
